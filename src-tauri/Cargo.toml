[package]
name = "csm-desktop"
version = "0.1.0"
description = "CSM Desktop: the graphical client for the Code Session Manager"
authors = ["Okpe Onoja Godwin <okpeonoja18@gmail.com>"]
license = "MIT"
repository = "https://github.com/onoja123/csm-desktop"
edition = "2021"

[lib]
name = "csm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "macros", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
dirs = "6"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
